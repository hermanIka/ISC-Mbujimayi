kind = "web"
previewPath = "/"
title = "ISC Mbujimayi Platform"
version = "1.0.0"
id = "artifacts/isc-platform"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25266

[services.development]
run = "pnpm --filter @workspace/isc-platform run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/isc-platform", "run", "build" ]
publicDir = "artifacts/isc-platform/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25266"
BASE_PATH = "/"
